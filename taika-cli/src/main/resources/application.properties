spring.ai.model.chat=google-genai
spring.ai.google.genai.project-id=lumo-ws
spring.ai.google.genai.location=europe-west3
spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.options.temperature=1.0
spring.ai.google.genai.chat.include-thoughts=true

# Retry policy for rate limits (HTTP 429) and transient network errors
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000ms
 
# ===================================================================
# AI Embedding Model Settings (per documentation)
# ===================================================================
spring.ai.google.genai.embedding.project-id=${spring.ai.google.genai.project-id}
spring.ai.google.genai.embedding.location=${spring.ai.google.genai.location}
spring.ai.google.genai.embedding.text.options.model=text-embedding-004